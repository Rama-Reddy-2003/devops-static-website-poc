name: CI/CD Pipeline - Build and Push Image

on:
  push:
    branches: [ "main" ]

jobs:
  validate-build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code to the runner
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Validate essential project files
    - name: Validate Files
      run: |
        echo "Validating project files..."
        test -s index.html || (echo "Error: index.html missing or empty!" && exit 1)
        test -s k8s.yaml || (echo "Error: k8s.yaml missing or empty!" && exit 1)
        echo "Validation successful!"

    # 3. Log in to Docker Hub using secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Extract Docker metadata (tags, labels)
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/static-web-app
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 5. Build and Push the Docker image to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}